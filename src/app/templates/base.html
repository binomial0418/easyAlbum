<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>極簡相簿</title>
    
    <!-- PWA 配置 -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="EasyAlbum">
    <link rel="apple-touch-icon" href="https://img.icons8.com/color/192/gallery.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <!-- 註冊 Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => {
                        console.log('Service Worker 註冊成功 Scope: ', reg.scope);
                        
                        // 監聽是否有新版本下載完成
                        reg.addEventListener('updatefound', () => {
                            const newWorker = reg.installing;
                            newWorker.addEventListener('statechange', () => {
                                // 當新版 SW 安裝完成，且目前網頁已有舊版 SW 控制時，說明這是一次更新
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    console.log('[PWA] 偵測到新版本已就緒，自動更新中...');
                                    window.location.reload();
                                }
                            });
                        });
                    })
                    .catch(err => console.log('Service Worker 註冊失敗: ', err));
            });
        }
    </script>

    <style>
        html, body {
            overflow-x: hidden;
            width: 100%;
        }

        [x-cloak] {
            display: none !important;
        }

        .aspect-square {
            aspect-ratio: 1 / 1;
        }
    </style>
</head>

<body class="bg-gray-100 min-h-screen text-gray-800">
    <nav class="bg-white shadow mb-6">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            {% if current_user.is_authenticated %}
            <a href="/" class="text-xl font-bold text-blue-600">極簡相簿</a>
            <div class="flex items-center space-x-4">
                <a href="/admin/visitor-settings" class="text-sm text-gray-600 hover:text-blue-600 flex items-center transition">
                    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                    </svg>
                    訪客設定
                </a>
                <a href="/logout" class="text-sm text-gray-500 hover:text-red-500 transition">登出</a>
            </div>
            {% else %}
            <a href="/visitor/" class="text-xl font-bold text-blue-600">極簡相簿</a>
            <a href="/login" class="text-sm text-gray-500 hover:text-blue-600 transition">管理員登入</a>
            {% endif %}
        </div>
    </nav>

    <main class="container mx-auto px-4 pb-12">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-gray-200 py-6 mt-auto">
        <div class="container mx-auto px-4 text-center text-gray-500 text-sm">
            &copy; 2026 EasyAlbum. Powered by Flask & Docker.
        </div>
    </footer>
</body>

</html>
