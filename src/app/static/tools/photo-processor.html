<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浮水印與相片處理工具</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- exifr (完整版，支援 LensModel / MakerNote) -->
    <script src="https://cdn.jsdelivr.net/npm/exifr@7/dist/full.umd.js"></script>
    <!-- piexifjs (EXIF 注入，保留原始相機資訊) -->
    <script src="https://cdn.jsdelivr.net/npm/piexifjs@1.0.6/piexif.js"></script>
    <!-- Google Fonts (Outfit + Nunito 圓體，近似 Yuanti TC) -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', 'PingFang TC', 'Heiti TC', -apple-system, sans-serif;
            background: radial-gradient(circle at center, #1e1e2f 0%, #0c0c14 100%);
        }
        .glass-panel {
            background: rgba(30, 30, 50, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col items-center p-3 md:p-8">

    <!-- Main Content -->
    <main class="w-full max-w-4xl grid grid-cols-1 lg:grid-cols-12 gap-4 md:gap-8 items-start mb-8">

        <!-- Controls Column -->
        <div class="lg:col-span-5 space-y-4 order-2 lg:order-1">

            <!-- Parameters Panel -->
            <div class="glass-panel rounded-2xl p-4 md:p-6 shadow-xl relative overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-indigo-500 to-purple-500"></div>
                <h2 class="text-base md:text-lg font-semibold mb-3 md:mb-4 text-indigo-300 flex items-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
                    設定
                </h2>

                <div class="space-y-3 md:space-y-4 text-sm">
                    <!-- Toggles: 手機版 2 欄並排 -->
                    <div class="grid grid-cols-2 gap-2 pb-3 border-b border-slate-700/50">
                        <!-- Resize Option -->
                        <div class="flex items-center justify-between bg-slate-800/50 rounded-xl px-3 py-2.5 border border-slate-700/40">
                            <div class="mr-2">
                                <span class="text-xs font-medium text-slate-200 leading-tight block">限制尺寸</span>
                                <span class="text-[10px] text-slate-500 hidden md:block">最大 1920px</span>
                            </div>
                            <label class="relative inline-flex items-center cursor-pointer flex-shrink-0">
                                <input type="checkbox" id="param-resize" class="sr-only peer" checked>
                                <div class="w-9 h-5 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-slate-300 after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-teal-500"></div>
                            </label>
                        </div>
                        <!-- Auto Levels -->
                        <div class="flex items-center justify-between bg-slate-800/50 rounded-xl px-3 py-2.5 border border-slate-700/40">
                            <div class="mr-2">
                                <span class="text-xs font-medium text-slate-200 leading-tight block">自動對比</span>
                                <span class="text-[10px] text-slate-500 hidden md:block">色彩平衡</span>
                            </div>
                            <label class="relative inline-flex items-center cursor-pointer flex-shrink-0">
                                <input type="checkbox" id="param-autolevel" class="sr-only peer" checked>
                                <div class="w-9 h-5 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-slate-300 after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-teal-500"></div>
                            </label>
                        </div>
                    </div>

                    <!-- Sliders: 手機版 2 欄並排 -->
                    <div class="grid grid-cols-2 md:grid-cols-1 gap-x-4 gap-y-3 pb-3 border-b border-slate-700/50">
                        <!-- Clarity Slider -->
                        <div>
                            <div class="flex justify-between mb-1">
                                <span class="text-slate-300 text-xs md:text-sm">清晰度</span>
                                <span id="val-clarity" class="text-indigo-400 text-xs">5</span>
                            </div>
                            <input type="range" id="param-clarity" min="0" max="50" value="5" class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-indigo-500">
                        </div>

                        <!-- Vibrance Slider -->
                        <div>
                            <div class="flex justify-between mb-1">
                                <span class="text-slate-300 text-xs md:text-sm">自然飽和度</span>
                                <span id="val-vibrance" class="text-indigo-400 text-xs">4</span>
                            </div>
                            <input type="range" id="param-vibrance" min="0" max="50" value="4" class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-indigo-500">
                        </div>

                        <!-- Screen Slider -->
                        <div>
                            <div class="flex justify-between mb-1">
                                <span class="text-slate-300 text-xs md:text-sm">濾鏡淡化</span>
                                <span id="val-screen" class="text-indigo-400 text-xs">2</span>
                            </div>
                            <input type="range" id="param-screen" min="0" max="30" value="2" class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-indigo-500">
                        </div>

                        <!-- Sharpen Slider -->
                        <div>
                            <div class="flex justify-between mb-1">
                                <span class="text-slate-300 text-xs md:text-sm">銳化</span>
                                <span id="val-sharpen" class="text-indigo-400 text-xs">2</span>
                            </div>
                            <input type="range" id="param-sharpen" min="0" max="10" value="2" class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-indigo-500">
                        </div>
                    </div>

                    <!-- Watermark Opacity Slider -->
                    <div>
                        <div class="flex justify-between mb-1">
                            <span class="text-slate-300 text-xs md:text-sm">浮水印透明度</span>
                            <span id="val-fade" class="text-indigo-400 text-xs">60</span>
                        </div>
                        <input type="range" id="param-fade" min="0" max="100" value="60" class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-indigo-500">
                    </div>

                    <!-- Advanced Settings: 手機版可折疊 -->
                    <details class="pt-3 border-t border-slate-700/50 group">
                        <summary class="flex items-center justify-between cursor-pointer list-none text-xs font-medium text-slate-400 hover:text-slate-200 transition-colors select-none">
                            <span class="flex items-center gap-1.5">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                                進階設定（字型與文字）
                            </span>
                            <svg class="w-4 h-4 transition-transform group-open:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </summary>

                        <div class="mt-3 space-y-3">
                            <!-- Font Settings -->
                            <div class="space-y-3">
                                <span class="font-medium text-slate-200 text-xs block">浮水印字型設定</span>

                                <div>
                                    <label class="text-xs text-slate-400 block mb-1">字型</label>
                                    <select id="param-font-family" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
                                        <option value="nunito">Nunito (近似 Yuanti TC 圓體)</option>
                                        <option value="system">系統黑體 (PingFang TC)</option>
                                        <option value="outfit">Outfit (現代英文)</option>
                                        <option value="serif">襯線體 (Georgia)</option>
                                        <option value="mono">等寬體 (Courier New)</option>
                                    </select>
                                </div>

                                <div class="flex items-center justify-between bg-slate-800/50 rounded-xl px-3 py-2.5 border border-slate-700/40">
                                    <span class="text-xs font-medium text-slate-200">斜體效果</span>
                                    <label class="relative inline-flex items-center cursor-pointer flex-shrink-0">
                                        <input type="checkbox" id="param-italic" class="sr-only peer">
                                        <div class="w-9 h-5 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-slate-300 after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-teal-500"></div>
                                    </label>
                                </div>
                            </div>

                            <!-- Custom Text Overrides -->
                            <div class="space-y-3 pt-3 border-t border-slate-700/50">
                                <span class="font-medium text-slate-200 text-xs block">浮水印文字自訂</span>

                                <div>
                                    <label class="text-xs text-slate-400 block mb-1">部落格網址 (預設 Lens/Blog)</label>
                                    <input type="text" id="param-blog-url" value="Blog https://wp.inskychen.com" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
                                </div>

                                <div>
                                    <label class="text-xs text-slate-400 block mb-1">相簿網址</label>
                                    <input type="text" id="param-album-url" value="photo album https://photo.inskychen.com/visitor/" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
                                </div>
                            </div>
                        </div>
                    </details>

                </div>
            </div>

        </div>

        <!-- Preview Column -->
        <div class="lg:col-span-7 space-y-4 order-1 lg:order-2">

            <!-- Preview Panel -->
            <div class="glass-panel rounded-2xl p-4 md:p-6 shadow-xl relative overflow-hidden flex flex-col">
                <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-purple-500 to-teal-500"></div>
                <h2 class="text-base md:text-lg font-semibold mb-3 md:mb-4 text-indigo-300 flex items-center justify-between">
                    <span class="flex items-center">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                        預覽結果
                    </span>
                    <button id="exif-badge" onclick="openExifModal()" class="hidden text-xs bg-teal-500/20 text-teal-300 px-2.5 py-1 rounded-full border border-teal-500/30 cursor-pointer hover:bg-teal-500/30 transition-colors active:scale-95">
                        EXIF 已載入
                    </button>
                </h2>

                <!-- Image container -->
                <div class="flex items-center justify-center border border-slate-700/50 rounded-xl bg-black/30 p-2 md:p-4 relative overflow-hidden min-h-[180px] md:min-h-[300px]">
                    <div id="spinner" class="hidden absolute flex flex-col items-center justify-center space-y-2 z-10">
                        <div class="w-10 h-10 border-4 border-indigo-400 border-t-transparent rounded-full animate-spin"></div>
                        <span class="text-xs text-indigo-300">影像優化與渲染中...</span>
                    </div>

                    <div id="preview-placeholder" class="text-slate-500 text-center flex flex-col items-center">
                        <svg class="w-12 h-12 md:w-16 md:h-16 mb-2 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                        <span class="text-sm">請先選擇照片</span>
                    </div>

                    <img id="preview-img" class="max-h-[50vh] md:max-h-[500px] w-full object-contain rounded-lg shadow-lg hidden" alt="浮水印預覽圖" />
                </div>

                <!-- Action Buttons -->
                <input type="file" id="file-input" accept="image/*" class="hidden" />
                <div class="mt-3 md:mt-4 grid grid-cols-3 gap-2 md:gap-3">
                    <label for="file-input" id="btn-load" class="py-2.5 md:py-3 px-2 rounded-xl bg-slate-800 border border-slate-700 text-slate-300 font-semibold flex items-center justify-center gap-1.5 shadow-lg hover:bg-slate-700 hover:text-white transition-all active:scale-[0.98] text-sm cursor-pointer">
                        <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-8-8l4-4m0 0l4 4m-4-4v12"></path></svg>
                        <span id="upload-label-text">載入</span>
                    </label>
                    <button id="btn-share" disabled class="py-2.5 md:py-3 px-2 rounded-xl bg-gradient-to-r from-teal-500 to-indigo-600 text-white font-semibold flex items-center justify-center gap-1.5 shadow-lg opacity-50 cursor-not-allowed hover:from-teal-400 hover:to-indigo-500 transition-all active:scale-[0.98] text-sm">
                        <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 10.742l4.684-2.342m0 0l-4.684-2.342m4.684 2.342l4.684 2.342m-9.368-4.684a3 3 0 110-6 3 3 0 010 6zm6 8a3 3 0 110-6 3 3 0 010 6zm6 8a3 3 0 110-6 3 3 0 010 6z"></path></svg>
                        <span>分享</span>
                    </button>
                    <button id="btn-download" disabled class="py-2.5 md:py-3 px-2 rounded-xl bg-slate-800 border border-slate-700 text-slate-300 font-semibold flex items-center justify-center gap-1.5 shadow-lg opacity-50 cursor-not-allowed hover:bg-slate-700 hover:text-white transition-all active:scale-[0.98] text-sm">
                        <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        <span>下載</span>
                    </button>
                </div>
                <div id="save-tip" class="hidden text-xs text-center text-slate-400 mt-2 md:mt-3">
                    💡 長按預覽圖可選擇「加入照片」直接儲存至相簿
                </div>
                <!-- 捷徑橋接：貼上區域（?clip=1 時顯示） -->
                <div id="clip-zone" class="hidden mt-2">
                    <div id="paste-target" contenteditable="true"
                         class="w-full py-3 rounded-xl border-2 border-dashed border-teal-500/50 text-teal-300 text-xs text-center cursor-pointer select-none outline-none bg-teal-500/5 active:bg-teal-500/10"
                         onclick="this.focus()"
                         onkeydown="return false">
                        📋 長按此處 → 點「貼上」匯入照片
                    </div>
                </div>
            </div>

        </div>

    </main>

    <!-- EXIF Floating Modal -->
    <div id="exif-modal" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="closeExifModal()"></div>
        <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 glass-panel rounded-2xl p-5 w-full max-w-xs shadow-2xl">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-sm font-bold text-slate-200 flex items-center gap-2">
                    <svg class="w-4 h-4 text-teal-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    EXIF 資訊
                </h3>
                <button onclick="closeExifModal()" class="text-slate-400 hover:text-white transition bg-slate-800 hover:bg-slate-700 rounded-full p-1.5">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="space-y-3">
                <div class="bg-slate-800/60 rounded-xl px-4 py-3">
                    <span class="text-slate-500 text-[10px] uppercase tracking-wider block mb-0.5">相機型號</span>
                    <span id="exif-model" class="text-slate-100 text-sm font-medium">-</span>
                </div>
                <div class="bg-slate-800/60 rounded-xl px-4 py-3">
                    <span class="text-slate-500 text-[10px] uppercase tracking-wider block mb-0.5">鏡頭型號</span>
                    <span id="exif-lens" class="text-slate-100 text-sm font-medium">-</span>
                </div>
                <div class="bg-slate-800/60 rounded-xl px-4 py-3">
                    <span class="text-slate-500 text-[10px] uppercase tracking-wider block mb-0.5">拍攝日期</span>
                    <span id="exif-date" class="text-slate-100 text-sm font-medium">-</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Canvas for Image Processing (Hidden) -->
    <canvas id="canvas" class="hidden"></canvas>

    <script>

        // 處理載入檔案
        async function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                alert('請選擇圖片檔案！');
                return;
            }

            originalFileName = file.name;
            if (uploadLabelText) uploadLabelText.textContent = file.name.length > 24 ? file.name.slice(0, 22) + '…' : file.name;
            spinner.classList.remove('hidden');
            previewPlaceholder.classList.add('hidden');
            previewImg.classList.add('hidden');

            // 讀取 EXIF — 使用 exifr (支援 LensModel / MakerNote)
            try {
                const exifData = await exifr.parse(file, {
                    tiff: true,
                    exif: true,
                    iptc: false,
                    xmp: false,
                    icc: false,
                    jfif: false
                }) || {};

                const model   = (exifData.Model   || "").trim();
                const lens    = (exifData.LensModel || exifData.Lens || "").trim();
                const dateRaw = exifData.DateTimeOriginal || exifData.CreateDate || null;

                let dateStr = "";
                if (dateRaw instanceof Date) {
                    dateStr = dateRaw.getFullYear() + '.'
                            + String(dateRaw.getMonth() + 1).padStart(2, '0') + '.'
                            + String(dateRaw.getDate()).padStart(2, '0');
                } else if (typeof dateRaw === 'string' && dateRaw) {
                    const parts = dateRaw.split(' ')[0].split(':');
                    if (parts.length === 3) dateStr = parts.join('.');
                }
                if (!dateStr) {
                    const d = new Date();
                    dateStr = d.getFullYear() + '.' + String(d.getMonth()+1).padStart(2, '0') + '.' + String(d.getDate()).padStart(2, '0');
                }

                originalExif = { model, lens, date: dateStr };

                console.warn("EXIF 讀取失敗:", err);
                const d = new Date();
                originalExif = {
                    model: "", lens: "",
                    date: d.getFullYear() + '.' + String(d.getMonth()+1).padStart(2, '0') + '.' + String(d.getDate()).padStart(2, '0')
                };
            }

            // 更新 UI 的 EXIF 欄位
            exifModel.textContent = originalExif.model || "無相機資訊";
            exifLens.textContent  = originalExif.lens  || "無鏡頭資訊";
            exifDate.textContent  = originalExif.date;
            exifBadge.classList.remove('hidden');

            // 載入圖片
            const reader = new FileReader();
            reader.onload = function(e) {
                // 萃取原始 EXIF bytes（供匯出時注入）
                try {
                    originalExifBytes = piexif.load(e.target.result);
                } catch (err) {
                    originalExifBytes = null;
                }
                originalImage = new Image();
                originalImage.onload = function() {
                    triggerProcess();
                };
                originalImage.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // 防抖動處理 (避免滑桿拉動時過度卡頓)
        let processTimeout = null;
        function triggerProcess() {
            if (processTimeout) clearTimeout(processTimeout);
            spinner.classList.remove('hidden');
            processTimeout = setTimeout(processImage, 100);
        }

        // 影像處理主核心
        function processImage() {
            if (!originalImage) return;

            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');

            let w = originalImage.naturalWidth;
            let h = originalImage.naturalHeight;

            // 1. 調整尺寸
            const isResize = paramResize.checked;
            const maxEdge = 1920;
            const longer = Math.max(w, h);
            
            if (isResize && longer > maxEdge) {
                const scale = maxEdge / longer;
                w = Math.round(w * scale);
                h = Math.round(h * scale);
            }

            canvas.width = w;
            canvas.height = h;
            
            // 繪製原始影像
            ctx.drawImage(originalImage, 0, 0, w, h);

            // 取得 ImageData 進行像素計算
            let imgData = ctx.getImageData(0, 0, w, h);
            let d = imgData.data;

            // 2. 自動色彩平衡與自動對比 (Auto Level & Auto Contrast)
            if (paramAutolevel.checked) {
                let rMin = 255, rMax = 0;
                let gMin = 255, gMax = 0;
                let bMin = 255, bMax = 0;
                
                // 掃描尋找極值
                for (let i = 0; i < d.length; i += 4) {
                    const r = d[i], g = d[i+1], b = d[i+2];
                    if (r < rMin) rMin = r;
                    if (r > rMax) rMax = r;
                    if (g < gMin) gMin = g;
                    if (g > gMax) gMax = g;
                    if (b < bMin) bMin = b;
                    if (b > bMax) bMax = b;
                }

                // 進行色彩通道對比拉伸 (Auto Level)
                for (let i = 0; i < d.length; i += 4) {
                    if (rMax > rMin) d[i]   = Math.min(255, Math.max(0, ((d[i]   - rMin) * 255) / (rMax - rMin)));
                    if (gMax > gMin) d[i+1] = Math.min(255, Math.max(0, ((d[i+1] - gMin) * 255) / (gMax - gMin)));
                    if (bMax > bMin) d[i+2] = Math.min(255, Math.max(0, ((d[i+2] - bMin) * 255) / (bMax - bMin)));
                }
            }

            // 3. 自然飽和度 (Vibrance)
            const vibranceAmount = parseInt(paramVibrance.value);
            if (vibranceAmount > 0) {
                const factor = 1 + vibranceAmount / 100.0 * 0.3;
                const rw = 0.299, gw = 0.587, bw = 0.114;
                for (let i = 0; i < d.length; i += 4) {
                    const r = d[i], g = d[i+1], b = d[i+2];
                    const gray = rw * r + gw * g + bw * b;
                    d[i]   = Math.min(255, Math.max(0, gray + (r - gray) * factor));
                    d[i+1] = Math.min(255, Math.max(0, gray + (g - gray) * factor));
                    d[i+2] = Math.min(255, Math.max(0, gray + (b - gray) * factor));
                }
            }

            // 4. 濾鏡淡化 (Screen - 類似白平衡淡雅風格)
            const screenAmount = parseInt(paramScreen.value);
            if (screenAmount > 0) {
                const screenFactor = screenAmount / 100.0 * 0.1;
                const b_val = Math.round(screenAmount * 2.55);
                for (let i = 0; i < d.length; i += 4) {
                    d[i]   = Math.min(255, Math.max(0, d[i]   * (1 - screenFactor) + b_val * screenFactor));
                    d[i+1] = Math.min(255, Math.max(0, d[i+1] * (1 - screenFactor) + b_val * screenFactor));
                    d[i+2] = Math.min(255, Math.max(0, d[i+2] * (1 - screenFactor) + b_val * screenFactor));
                }
            }

            // 寫回 Canvas 以便進行 Clarity 與 Sharpen 濾鏡
            ctx.putImageData(imgData, 0, 0);

            // 5. 清晰度 (Clarity)
            const clarityAmount = parseInt(paramClarity.value);
            if (clarityAmount > 0) {
                const clarityFactor = clarityAmount / 100.0 * 0.4;
                
                // 利用 GPU 加速模糊產生細節層
                const blurCanvas = document.createElement('canvas');
                blurCanvas.width = w;
                blurCanvas.height = h;
                const bctx = blurCanvas.getContext('2d');
                bctx.filter = 'blur(10px)';
                bctx.drawImage(canvas, 0, 0);
                
                const origData = ctx.getImageData(0, 0, w, h);
                const blurData = bctx.getImageData(0, 0, w, h);
                const o = origData.data;
                const b = blurData.data;

                for (let i = 0; i < o.length; i += 4) {
                    for (let c = 0; c < 3; c++) {
                        const idx = i + c;
                        const detail = o[idx] - b[idx] + 128;
                        const boosted = o[idx] + detail - 128 * clarityFactor;
                        o[idx] = Math.min(255, Math.max(0, o[idx] * (1 - clarityFactor) + boosted * clarityFactor));
                    }
                }
                ctx.putImageData(origData, 0, 0);
            }

            // 6. 銳化 (Sharpen - Unsharp Mask)
            const sharpenAmount = parseInt(paramSharpen.value);
            if (sharpenAmount > 0) {
                const sharpFactor = sharpenAmount * 5 / 100.0;
                const threshold = 3;

                const sharpBlurCanvas = document.createElement('canvas');
                sharpBlurCanvas.width = w;
                sharpBlurCanvas.height = h;
                const sbctx = sharpBlurCanvas.getContext('2d');
                sbctx.filter = 'blur(1.5px)';
                sbctx.drawImage(canvas, 0, 0);

                const origData = ctx.getImageData(0, 0, w, h);
                const sbData = sbctx.getImageData(0, 0, w, h).data;
                const o = origData.data;

                for (let i = 0; i < o.length; i += 4) {
                    for (let c = 0; c < 3; c++) {
                        const idx = i + c;
                        const diff = o[idx] - sbData[idx];
                        if (Math.abs(diff) > threshold) {
                            o[idx] = Math.min(255, Math.max(0, o[idx] + diff * sharpFactor));
                        }
                    }
                }
                ctx.putImageData(origData, 0, 0);
            }

            // 7. 載入 Logo 並繪製浮水印
            const logoImg = new Image();
            logoImg.onload = function() {
                const isPortrait = h > w;
                
                // 浮水印參數 (以 Python 固定參數為標準)
                // 橫圖 / 直圖共用坐標基準
                const logo_x = 23;
                const logo_from_bottom = 38;
                const logo_w = 47;
                const logo_h = 47;
                
                const font_px = 14;
                const opacity = parseInt(paramFade.value) / 100;

                // 各行文字 y 頂端距圖片底部高度 (y_from_bottom)
                const ar_x = 74, ar_y = 84; // All Rights Reserved
                const md_x = 74, md_y = 67; // [model] @ [date]
                const bl_x = 74, bl_y = 50; // Blog/Lens
                const pa_x = 23, pa_y = 35; // Photo Album

                // 繪製 Logo (帶透明度)
                const logo_y = h - logo_from_bottom - logo_h;
                ctx.save();
                ctx.globalAlpha = opacity;
                ctx.drawImage(logoImg, logo_x, logo_y, logo_w, logo_h);
                ctx.restore();

                // 繪製文字
                const fontFamilyMap = {
                    'nunito': "'Nunito', 'PingFang TC', sans-serif",
                    'system': "'PingFang TC', 'Heiti TC', -apple-system, sans-serif",
                    'outfit': "'Outfit', sans-serif",
                    'serif':  "Georgia, 'Times New Roman', serif",
                    'mono':   "'Courier New', Courier, monospace",
                };
                const selectedFamily = fontFamilyMap[paramFontFamily.value] || fontFamilyMap['nunito'];
                const italicPrefix = paramItalic.checked ? 'italic ' : '';

                ctx.save();
                ctx.globalAlpha = opacity;
                ctx.fillStyle = '#FFFFFF';
                ctx.font = `${italicPrefix}14px ${selectedFamily}`;
                ctx.textBaseline = 'top';

                // 1. All Rights Reserved
                ctx.fillText("All Rights Reserved", ar_x, h - ar_y);

                // 2. Camera Model @ Date
                const modelText = `${originalExif.model || "Unknown"} @ ${originalExif.date}`;
                ctx.fillText(modelText, md_x, h - md_y);

                // 3. Blog/Lens Text
                const lensText = originalExif.lens;
                const blogText = lensText ? lensText : paramBlogUrl.value;
                ctx.fillText(blogText, bl_x, h - bl_y);

                // 4. Photo Album Text
                ctx.fillText(paramAlbumUrl.value, pa_x, h - pa_y);

                ctx.restore();

                // 將最終 Canvas 輸出成 DataURL，並注入原始 EXIF
                let outputUrl = canvas.toDataURL('image/jpeg', 0.95);
                if (originalExifBytes) {
                    try {
                        outputUrl = piexif.insert(piexif.dump(originalExifBytes), outputUrl);
                    } catch (err) {
                        console.warn('EXIF 注入失敗:', err);
                    }
                }
                processedDataUrl = outputUrl;
                previewImg.src = outputUrl;
                previewImg.classList.remove('hidden');
                spinner.classList.add('hidden');

                // 啟用按鈕
                btnShare.disabled = false;
                btnShare.classList.remove('opacity-50', 'cursor-not-allowed');
                btnDownload.disabled = false;
                btnDownload.classList.remove('opacity-50', 'cursor-not-allowed');
                saveTip.classList.remove('hidden');
            };
            logoImg.src = DEFAULT_LOGO_BASE64;
        }

        // 分享儲存功能
        btnShare.addEventListener('click', async () => {
            if (!processedDataUrl) return;

            const res = await fetch(processedDataUrl);
            const blob = await res.blob();
            const file = new File([blob], originalFileName.replace(/\.[^/.]+$/, "") + "_watermarked.jpg", { type: "image/jpeg" });

            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                try {
                    await navigator.share({ files: [file] });
                } catch (err) {
                    if (err.name !== 'AbortError') console.error('分享錯誤:', err);
                }
            } else {
                alert('您的瀏覽器不支援直接分享檔案，請直接「長按圖片」選擇「加入照片」儲存至相簿。');
            }
        });

        // 下載功能 (儲存至檔案 App)
        btnDownload.addEventListener('click', () => {
            if (!processedDataUrl) return;
            const a = document.createElement('a');
            a.href = processedDataUrl;
            a.download = originalFileName.replace(/\.[^/.]+$/, "") + "_watermarked.jpg";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        });
    </script>
</body>
</html>
